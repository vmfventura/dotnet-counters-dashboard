name: Release

# Packages the extension and creates a GitHub release when a version tag is pushed, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
# The tag must match the "version" field in package.json.
# Publishing to the Marketplace is manual: upload the .vsix from the release at
# https://marketplace.visualstudio.com/manage/publishers/vmfventura.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        # README images and links point to this tag in the GitHub repository.
        run: >
          npx vsce package
          --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_REF_NAME"
          --out "dotnet-counters-dashboard-$VERSION.vsix"

      - name: Create GitHub release
        run: >
          gh release create "$GITHUB_REF_NAME" "dotnet-counters-dashboard-$VERSION.vsix"
          --title "$GITHUB_REF_NAME"
          --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for the changes in this version."
        env:
          GH_TOKEN: ${{ github.token }}
